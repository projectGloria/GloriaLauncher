name: Build & Release GloriaLauncher

# Builds the Windows desktop app and publishes it as a GitHub Release.
# Runs when a version tag (e.g. v0.1.0) is pushed, or manually from the Actions tab.
# The release tag comes from the "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "GloriaLauncher v__VERSION__"
          releaseBody: "Windows installers for GloriaLauncher v__VERSION__. Download the -setup.exe (recommended) or the .msi."
          releaseDraft: false
          prerelease: false
