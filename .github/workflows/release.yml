name: Build & Release GloriaLauncher

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify installer without publishing a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check version manifests
        id: check
        shell: bash
        run: |
          set -euo pipefail

          read_toml_version() {
            grep -E '^version\s*=\s*"[^"]+"' "$1" | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/'
          }

          GLORIA_VER="$(read_toml_version gloria.toml)"
          PKG_VER="$(node -p "require('./package.json').version")"
          CARGO_VER="$(read_toml_version src-tauri/Cargo.toml)"
          TAURI_VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          if [[ -z "$GLORIA_VER" ]]; then
            echo "::error::Could not read version from gloria.toml"
            exit 1
          fi

          if [[ "$GLORIA_VER" != "$PKG_VER" || "$GLORIA_VER" != "$CARGO_VER" || "$GLORIA_VER" != "$TAURI_VER" ]]; then
            echo "::error::Version mismatch: gloria.toml=$GLORIA_VER package.json=$PKG_VER Cargo.toml=$CARGO_VER tauri.conf.json=$TAURI_VER"
            exit 1
          fi

          echo "version=$GLORIA_VER" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          PREV_VER=""
          if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${BEFORE}:gloria.toml" 2>/dev/null; then
              PREV_VER="$(git show "${BEFORE}:gloria.toml" | grep -E '^version\s*=\s*"[^"]+"' | head -n1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/' || true)"
            fi
          fi

          if [[ "$GLORIA_VER" != "$PREV_VER" ]]; then
            echo "Version changed ($PREV_VER -> $GLORIA_VER); triggering build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($GLORIA_VER); skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run frontend and Rust checks
        shell: pwsh
        run: |
          npm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri release binary
        shell: pwsh
        run: npx tauri build --no-bundle

      - name: Stage application payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path stage) { Remove-Item -Recurse -Force stage }
          New-Item -ItemType Directory -Path stage | Out-Null
          $bin = "src-tauri\target\release\gloria-launcher.exe"
          if (-not (Test-Path $bin)) { throw "Built binary not found: $bin" }
          Copy-Item $bin "stage\GloriaLauncher.exe"

      - name: Pack installer with GloriaSetup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx --yes gloria-setup@0.2.4 --app stage --manifest gloria.toml --version ${{ needs.version.outputs.version }} --out dist

      - name: Dry-run verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist\GloriaLauncher_${{ needs.version.outputs.version }}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer not found: $setup" }
          $proc = Start-Process -FilePath $setup -ArgumentList '/S --dry-run' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "GloriaSetup dry-run failed with exit code $($proc.ExitCode)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gloria-launcher-installer
          path: dist/GloriaLauncher_${{ needs.version.outputs.version }}_x64-setup.exe
          compression-level: 0
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gloria-launcher-installer
          path: release-assets

      - name: Generate checksums and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          SETUP_FILE="GloriaLauncher_${VERSION}_x64-setup.exe"
          if [[ ! -f "$SETUP_FILE" ]]; then
            echo "::error::Installer missing: $SETUP_FILE"
            exit 1
          fi
          sha256sum "$SETUP_FILE" > SHA256SUMS.txt

          TAG="v${VERSION}"
          PRERELEASE_FLAG=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$SETUP_FILE" \
            SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            "${PRERELEASE_FLAG[@]}" \
            --title "GloriaLauncher ${TAG}" \
            --notes "Windows installer for GloriaLauncher ${TAG} (built with GloriaSetup)."

          VERIFY_DIR="$(mktemp -d)"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && sha256sum --check SHA256SUMS.txt)
          rm -rf "$VERIFY_DIR"

          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --draft=false
